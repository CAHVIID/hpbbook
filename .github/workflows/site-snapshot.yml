# TEMPORARY: builds the site on the style branch and pushes the HTML to
# claude/site-snapshot so the custom stylesheet can be checked against the
# real book theme. Remove before merging.
name: Site snapshot (temporary)

on:
  push:
    branches: [claude/project-thread-u4ttv4]

permissions:
  contents: write

env:
  BASE_URL: /hpbbook

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g mystmd
      - run: myst build --html
      - name: Push HTML to claude/site-snapshot
        run: |
          cd _build/html
          git init -q -b claude/site-snapshot
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Site snapshot of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" claude/site-snapshot
