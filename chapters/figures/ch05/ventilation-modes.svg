<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b7bb9"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d0663a"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa5ad"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="430" fill="#ffffff"/>

  <!-- (a) single-sided -->
  <rect x="90" y="222" width="200" height="108" fill="#f6f9fb"/>
  <path d="M90,245 L90,222 L290,222 L290,330 L90,330 L90,315" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="55" y1="280" x2="150" y2="280" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M20,300 C60,300 90,305 120,316 C160,326 220,325 262,323" fill="none" stroke="#2b7bb9" stroke-width="4" marker-end="url(#b)"/>
  <path d="M255,240 C190,238 130,262 25,262" fill="none" stroke="#d0663a" stroke-width="4" marker-end="url(#r)"/>
  <g font-size="15" fill="#222">
    <text x="90" y="40" font-weight="bold">(a) Single-sided</text>
    <text x="90" y="358">Driven by the temperature</text>
    <text x="90" y="376">difference over the height</text>
    <text x="90" y="394">of one opening. Weak.</text>
  </g>

  <!-- (b) cross -->
  <rect x="410" y="222" width="200" height="108" fill="#f6f9fb"/>
  <path d="M410,255 L410,222 L610,222 L610,255 M610,305 L610,330 L410,330 L410,305" fill="none" stroke="#333" stroke-width="3"/>
  <path d="M338,190 L395,190" fill="none" stroke="#9aa5ad" stroke-width="6" marker-end="url(#g)"/>
  <text x="338" y="170" font-size="15" fill="#6b757c">Wind</text>
  <path d="M338,282 C430,272 520,292 645,280" fill="none" stroke="#2b7bb9" stroke-width="4" marker-end="url(#b)"/>
  <g font-size="22" fill="#222" font-weight="bold">
    <text x="378" y="325">+</text>
    <text x="625" y="325">−</text>
  </g>
  <g font-size="15" fill="#222">
    <text x="410" y="40" font-weight="bold">(b) Cross</text>
    <text x="410" y="358">Driven by the wind pressure</text>
    <text x="410" y="376">difference between façades.</text>
    <text x="410" y="394">Strong but unreliable.</text>
  </g>

  <!-- (c) stack -->
  <rect x="730" y="110" width="180" height="220" fill="#f6f9fb"/>
  <path d="M730,330 L730,310 M730,260 L730,110 L840,110 M880,110 L910,110 L910,330 L730,330" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="730" y1="222" x2="815" y2="222" stroke="#333" stroke-width="5"/>
  <line x1="715" y1="190" x2="925" y2="190" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M665,285 C725,285 790,292 838,240" fill="none" stroke="#2b7bb9" stroke-width="4"/>
  <path d="M838,240 C855,210 860,160 860,72" fill="none" stroke="#d0663a" stroke-width="4" marker-end="url(#r)"/>
  <g stroke="#333" stroke-width="1.5">
    <line x1="935" y1="110" x2="935" y2="285"/>
    <line x1="929" y1="110" x2="941" y2="110"/>
    <line x1="929" y1="285" x2="941" y2="285"/>
  </g>
  <text x="941" y="205" font-size="16" font-style="italic" fill="#222">h</text>
  <g font-size="15" fill="#222">
    <text x="730" y="40" font-weight="bold">(c) Stack</text>
    <text x="730" y="358">Driven by the temperature</text>
    <text x="730" y="376">difference over the height h</text>
    <text x="730" y="394">between the openings.</text>
  </g>

  <!-- legend -->
  <g font-size="14" fill="#222">
    <line x1="90" y1="418" x2="130" y2="418" stroke="#2b7bb9" stroke-width="4"/>
    <text x="138" y="423">Cool outdoor air</text>
    <line x1="300" y1="418" x2="340" y2="418" stroke="#d0663a" stroke-width="4"/>
    <text x="348" y="423">Warm room air</text>
    <line x1="500" y1="418" x2="540" y2="418" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="548" y="423">Neutral pressure plane</text>
    <text x="740" y="423">+ / − wind pressure</text>
  </g>
</svg>
