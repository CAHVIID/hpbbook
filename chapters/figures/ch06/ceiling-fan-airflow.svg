<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b7bb9"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa5ad"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="380" fill="#ffffff"/>
  <!-- room -->
  <rect x="60" y="30" width="600" height="330" fill="#f6f9fb" stroke="#333" stroke-width="3"/>
  <!-- ceiling fan -->
  <line x1="360" y1="30" x2="360" y2="62" stroke="#333" stroke-width="4"/>
  <rect x="344" y="60" width="32" height="18" rx="6" fill="#555"/>
  <ellipse cx="290" cy="72" rx="56" ry="5" fill="#777"/>
  <ellipse cx="430" cy="72" rx="56" ry="5" fill="#777"/>
  <!-- jet -->
  <path d="M320,85 C318,160 330,230 340,300" fill="none" stroke="#2b7bb9" stroke-width="4" marker-end="url(#a)"/>
  <path d="M400,85 C402,160 390,230 380,300" fill="none" stroke="#2b7bb9" stroke-width="4" marker-end="url(#a)"/>
  <path d="M360,85 L360,300" fill="none" stroke="#2b7bb9" stroke-width="4" marker-end="url(#a)"/>
  <!-- spreading along floor -->
  <path d="M330,325 C260,340 190,342 110,338" fill="none" stroke="#2b7bb9" stroke-width="4" marker-end="url(#a)"/>
  <path d="M390,325 C460,340 530,342 610,338" fill="none" stroke="#2b7bb9" stroke-width="4" marker-end="url(#a)"/>
  <!-- return flow -->
  <path d="M90,320 C80,200 100,80 200,55 C240,47 270,50 290,58" fill="none" stroke="#9aa5ad" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#g)"/>
  <path d="M630,320 C640,200 620,80 520,55 C480,47 450,50 430,58" fill="none" stroke="#9aa5ad" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#g)"/>
  <!-- seated person near fan -->
  <g stroke="#333" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="470" cy="236" r="12" fill="#f6f9fb"/>
    <line x1="470" y1="248" x2="474" y2="292"/>
    <line x1="474" y1="292" x2="510" y2="292"/>
    <line x1="510" y1="292" x2="510" y2="330"/>
    <line x1="471" y1="262" x2="500" y2="274"/>
  </g>
  <g stroke="#8a6d4b" stroke-width="3" fill="none">
    <line x1="462" y1="300" x2="500" y2="300"/>
    <line x1="462" y1="300" x2="462" y2="358"/>
    <line x1="496" y1="300" x2="496" y2="358"/>
    <line x1="462" y1="300" x2="458" y2="250"/>
  </g>
  <!-- labels -->
  <g font-size="15" fill="#222">
    <text x="410" y="170">Fan jet</text>
    <text x="150" y="315">Spreading zone near the floor</text>
    <text x="120" y="150" fill="#6b757c">Slow return flow</text>
    <text x="528" y="190">Occupant feels</text>
    <text x="528" y="208">elevated air speed</text>
    <text x="528" y="226">(about 0.5 m/s)</text>
  </g>
</svg>
