<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b7bb9"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d0663a"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
  <g font-size="15" fill="#222" font-weight="bold">
    <text x="50" y="40">(a) Side-hung</text>
    <text x="370" y="40">(b) Bottom-hung, high, small Ar</text>
    <text x="690" y="40">(c) Bottom-hung, high, large Ar</text>
  </g>
  <!-- rooms: depth 5 m = 250 px, height 2.6 m = 130 px, floor y = 250, ceiling y = 120 -->

  <!-- (a) side-hung: opening 0.9-2.2 m => y 205..140 -->
  <rect x="50" y="120" width="250" height="130" fill="#f6f9fb"/>
  <path d="M50,140 L50,120 L300,120 L300,250 L50,250 L50,205" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="40" y1="172.5" x2="60" y2="172.5" stroke="#555" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M8,192 C40,192 58,194 68,206 C78,222 82,240 100,245 L280,246" fill="none" stroke="#2b7bb9" stroke-width="4" marker-end="url(#b)"/>
  <path d="M95,238 C150,236 220,238 280,240" fill="none" stroke="#2b7bb9" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M200,140 C130,148 80,152 14,154" fill="none" stroke="#d0663a" stroke-width="3" marker-end="url(#r)"/>
  <g font-size="13" fill="#222">
    <text x="50" y="290">Opens over the full height. The slow</text>
    <text x="50" y="308">inflow in the lower half drops and</text>
    <text x="50" y="326">spreads along the floor:</text>
    <text x="50" y="350" font-style="italic">u = K<tspan baseline-shift="sub" font-size="10">w</tspan> q₀ / (x + x₀)</text>
    <text x="50" y="374">Summer: cooling. Winter: draught.</text>
  </g>

  <!-- (b) bottom-hung high, attached -->
  <rect x="370" y="120" width="250" height="130" fill="#f6f9fb"/>
  <path d="M370,128 L370,120 L620,120 L620,250 L370,250 L370,140" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="370" y1="140" x2="378" y2="128" stroke="#555" stroke-width="3"/>
  <path d="M335,136 C360,136 374,128 392,124 C450,122 520,122 600,124" fill="none" stroke="#2b7bb9" stroke-width="4" marker-end="url(#b)"/>
  <path d="M605,140 C612,200 590,232 520,234 C460,234 430,215 420,185" fill="none" stroke="#9aa5ad" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g font-size="13" fill="#222">
    <text x="370" y="290">The sash throws the air up to the</text>
    <text x="370" y="308">ceiling, where it mixes with warm</text>
    <text x="370" y="326">room air:</text>
    <text x="370" y="350" font-style="italic">u<tspan baseline-shift="sub" font-size="10">m</tspan> = K<tspan baseline-shift="sub" font-size="10">a</tspan> U₀ √a₀ / (x + x₀)</text>
    <text x="370" y="374">Good for winter airing.</text>
  </g>

  <!-- (c) bottom-hung high, separates -->
  <rect x="690" y="120" width="250" height="130" fill="#f6f9fb"/>
  <path d="M690,128 L690,120 L940,120 L940,250 L690,250 L690,140" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="690" y1="140" x2="698" y2="128" stroke="#555" stroke-width="3"/>
  <path d="M655,136 C680,136 694,128 712,124 C740,123 760,124 775,130 C795,140 800,190 805,232 C808,244 830,246 925,246" fill="none" stroke="#2b7bb9" stroke-width="4" marker-end="url(#b)"/>
  <line x1="698" y1="113" x2="698" y2="104" stroke="#555"/>
  <line x1="780" y1="113" x2="780" y2="104" stroke="#555"/>
  <line x1="698" y1="108" x2="780" y2="108" stroke="#555"/>
  <text x="732" y="100" font-size="12" fill="#555">x<tspan baseline-shift="sub" font-size="10">s</tspan></text>
  <g font-size="13" fill="#222">
    <text x="690" y="290">With large ΔT or large flow, the</text>
    <text x="690" y="308">cold jet separates at the penetration</text>
    <text x="690" y="326">depth x<tspan baseline-shift="sub" font-size="10">s</tspan> and drops to the floor.</text>
    <text x="690" y="350">Keep the opening small when cold.</text>
  </g>
</svg>
