<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="820" height="440" fill="#ffffff"/>
  <g font-size="15" fill="#222">
    <text x="40" y="28" font-weight="bold">(a) Side-hung, opened 30°</text>
    <text x="440" y="28" font-weight="bold">(b) Bottom-hung, tilted 120 mm</text>
  </g>

  <!-- (a) plan view -->
  <text x="40" y="58" font-size="12" fill="#6b757c">Plan</text>
  <text x="270" y="58" font-size="12" fill="#6b757c">outside</text>
  <text x="270" y="122" font-size="12" fill="#6b757c">inside</text>
  <line x1="60" y1="100" x2="140" y2="100" stroke="#333" stroke-width="6"/>
  <line x1="260" y1="100" x2="330" y2="100" stroke="#333" stroke-width="6"/>
  <line x1="140" y1="100" x2="244" y2="40" stroke="#555" stroke-width="4"/>
  <path d="M140,100 m40,0 a40,40 0 0 0 -5.4,-20" fill="none" stroke="#999" stroke-width="1"/>
  <text x="186" y="94" font-size="12" fill="#555">α</text>
  <line x1="244" y1="40" x2="260" y2="100" stroke="#2b7bb9" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="258" y="70" font-size="13" fill="#2b7bb9">s</text>
  <circle cx="140" cy="100" r="3" fill="#222"/>
  <text x="112" y="122" font-size="11" fill="#555">hinge</text>

  <!-- (a) elevation: frame and gap -->
  <text x="40" y="160" font-size="12" fill="#6b757c">Free opening</text>
  <rect x="140" y="170" width="120" height="195" fill="none" stroke="#9aa5ad" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="198" y="170" width="62" height="97.5" fill="#f3c9b5"/>
  <rect x="198" y="267.5" width="62" height="97.5" fill="#bcd7ee"/>
  <rect x="198" y="170" width="62" height="195" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="120" y1="267.5" x2="300" y2="267.5" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="304" y="271" font-size="12" fill="#555">neutral plane</text>
  <text x="212" y="220" font-size="13" fill="#a8461f">out</text>
  <text x="217" y="320" font-size="13" fill="#1f5f92">in</text>
  <line x1="198" y1="378" x2="260" y2="378" stroke="#222" stroke-width="1"/>
  <text x="222" y="394" font-size="12" fill="#222">s</text>
  <line x1="128" y1="170" x2="128" y2="365" stroke="#222" stroke-width="1"/>
  <text x="114" y="320" font-size="12" fill="#222">h</text>
  <g font-size="13" fill="#222">
    <text x="40" y="418">Gap of width s = 2w sin(α/2) over the full height h.</text>
    <text x="40" y="434">Inflow in the lower half, outflow in the upper half.</text>
  </g>

  <!-- (b) section view -->
  <text x="440" y="58" font-size="12" fill="#6b757c">Section</text>
  <text x="485" y="80" font-size="12" fill="#6b757c">outside</text>
  <text x="600" y="80" font-size="12" fill="#6b757c">inside</text>
  <line x1="560" y1="40" x2="560" y2="52" stroke="#333" stroke-width="6"/>
  <line x1="560" y1="128" x2="560" y2="140" stroke="#333" stroke-width="6"/>
  <line x1="560" y1="128" x2="578" y2="54" stroke="#555" stroke-width="4"/>
  <circle cx="560" cy="128" r="3" fill="#222"/>
  <line x1="560" y1="52" x2="578" y2="54" stroke="#2b7bb9" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="584" y="56" font-size="13" fill="#2b7bb9">s</text>
  <text x="500" y="134" font-size="11" fill="#555">hinge</text>

  <!-- (b) unfolded gaps -->
  <text x="440" y="160" font-size="12" fill="#6b757c">Free opening (side gaps unfolded)</text>
  <rect x="560" y="170" width="120" height="195" fill="none" stroke="#9aa5ad" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- top slot -->
  <rect x="560" y="170" width="120" height="18" fill="#f3c9b5" stroke="#333" stroke-width="1.5"/>
  <!-- left triangle: tip at bottom (560,365), width 18 at top (y=170); neutral plane at y=203 -->
  <polygon points="560,365 560,203 545,203" fill="#bcd7ee"/>
  <polygon points="560,203 560,170 542,170 545,203" fill="#f3c9b5"/>
  <polygon points="560,365 560,170 542,170" fill="none" stroke="#333" stroke-width="1.5"/>
  <polygon points="680,365 680,203 695,203" fill="#bcd7ee"/>
  <polygon points="680,203 680,170 698,170 695,203" fill="#f3c9b5"/>
  <polygon points="680,365 680,170 698,170" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="520" y1="203" x2="720" y2="203" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="724" y="207" font-size="12" fill="#555">neutral plane</text>
  <text x="604" y="184" font-size="12" fill="#a8461f">out</text>
  <text x="505" y="250" font-size="13" fill="#1f5f92">in</text>
  <line x1="520" y1="247" x2="550" y2="247" stroke="#1f5f92" stroke-width="1"/>
  <g font-size="13" fill="#222">
    <text x="440" y="418">Two triangles that taper to zero at the hinge, plus a</text>
    <text x="440" y="434">top slot. The inflow passes through narrow slivers.</text>
  </g>
</svg>
